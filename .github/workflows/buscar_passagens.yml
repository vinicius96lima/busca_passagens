name: Buscar Passagens

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔥 Instala ODBC Driver 18 corretamente no Linux
      - name: Install ODBC Driver 18
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg unixodbc-dev
          
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
          | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      # 📦 Instala dependências Python
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testar conexão Python
        env:
          SERVER: ${{ secrets.SERVER }}
          DATABASE: ${{ secrets.DATABASE }}
          UID: ${{ secrets.UID }}
          PWD: ${{ secrets.PWD }}
        run: |
          python - <<EOF
          import os, pyodbc
          conn_str = (
              f"Driver={{ODBC Driver 18 for SQL Server}};"
              f"Server={os.getenv('SERVER')};"
              f"Database={os.getenv('DATABASE')};"
              f"Uid={os.getenv('UID')};"
              f"Pwd={os.getenv('PWD')};"
              "Encrypt=yes;"
              "TrustServerCertificate=no;"
              "Connection Timeout=30;"
          )
          print("Connection string:", conn_str.replace(os.getenv('PWD'), '***'))
          try:
              pyodbc.connect(conn_str)
              print("✅ Conexão OK")
          except Exception as e:
              print("❌ Erro:", e)
          EOF


      # 🚀 Executa o script FINAL
      - name: Rodar script
        env:
          SERPAPI_KEY: ${{secrets.SERPAPI_KEY}}
          EMAIL: ${{secrets.EMAIL}}
          EMAIL_DESTINO: ${{secrets.EMAIL_DESTINO}}
          APP_KEY: ${{secrets.APP_KEY}}
          SERVER: ${{secrets.SERVER}}
          DATABASE: ${{secrets.DATABASE}}
          UID: ${{secrets.UID}}
          PWD: ${{secrets.PWD}}

          TZ: America/Sao_Paulo

        run: python src/main.py
