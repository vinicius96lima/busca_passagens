name: Buscar Passagens

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔥 Instala ODBC Driver 18 corretamente no Linux
      - name: Install ODBC Driver 18
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg unixodbc-dev
          
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
          | sudo tee /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      # 📦 Instala dependências Python
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Debug SENHASQL real
        env:
          SENHASQL: ${{ secrets.SENHASQL }}
          
        
        run: |
          nc -vz tcp:admin-voo.database.windows.net,1433
          echo "SENHASQL length = ${#SENHASQL}"
          echo "SENHASQL first chars = ${SENHASQL:0:3}"
          echo "SENHASQL exists? ${SENHASQL:+YES}"
          echo "length: ${#SENHASQL}"
          env | grep SENHA
        

      # 🚀 Executa o script FINAL
      - name: Rodar script
        env:
          SERPAPI_KEY: ${{secrets.SERPAPI_KEY}}
          EMAIL: ${{secrets.EMAIL}}
          EMAIL_DESTINO: ${{secrets.EMAIL_DESTINO}}
          APP_KEY: ${{secrets.APP_KEY}}
          SERVER: ${{secrets.SERVER}}
          SENHASQL: ${{secrets.SENHASQL}}
          DATABASE: ${{secrets.DATABASE}}
          UID: ${{secrets.UID}}
         

          TZ: America/Sao_Paulo

        run: python src/main.py
